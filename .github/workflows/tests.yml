name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# a new push to a PR cancels its run that is still going
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      # the tests use fakes for models, APIs and ffmpeg, so they need no secrets or downloads.
      # The CPU build of torch: the default Linux wheel brings several GB of CUDA libraries
      - name: Install
        run: pip install -e ".[dev]" -c constraints.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run the tests
        run: pytest -q
