# Settings. Copy to config.toml (or pass --config path). Environment variables with the same name in
# upper case (e.g. TRANSLATOR in .env) override these, and command-line flags override both.
# Secrets (OPENAI_API_KEY, GOOGLE_APPLICATION_CREDENTIALS) belong in .env, not here.
# Empty values ("") use the default.

# Languages: source (empty = detect) and targets, comma-separated (empty = source-language subtitles only)
source_language = ""
target_languages = ""

# Vocal separation (needs the [separate] extra): transcribe the voices separated from music and noise by Demucs.
# Recovers speech hidden by background sound, but is slower. htdemucs_ft = best quality, htdemucs = ~4x faster
separate = false
demucs_model = "htdemucs_ft"

# Speech recognition: backend (whisperx, or mlx on Apple Silicon) and Whisper model
asr_backend = "whisperx"
whisper_model = "large-v3-turbo"
asr_device = ""

# Segments: lines shorter than segment_min_duration (s) are merged into a neighbouring line when the pause
# between them is at most segment_merge_gap (s)
segment_min_duration = 1.5
segment_merge_gap = 1.0

# Translation: gpt (OpenAI or any OpenAI-compatible server; uses the glossary and video context) or google
# (needs a Google Cloud key)
translator = "gpt"
glossary_file = ""          # JSON {"source term": "translation"}: spelling hints for transcription; used by gpt
video_context = ""          # one-line description of the video, used by gpt
llm_model = "gpt-5-mini"
llm_base_url = ""           # e.g. http://localhost:11434/v1 for Ollama; empty = OpenAI
