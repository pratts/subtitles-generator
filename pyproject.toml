[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitles-generator"
version = "0.1.0"
description = "Subtitles for any video, in any language"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # speech recognition with word-level timestamps (faster-whisper + VAD + wav2vec2 alignment)
    "whisperx>=3.8.6",
    # faster transcription on Apple Silicon (ASR_BACKEND=mlx)
    "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # translation (local NLLB uses transformers, installed with whisperx)
    "openai",
    "google-cloud-translate",
    "srt",
    # word segmentation for languages aligned per character: Japanese (fugashi + UniDic), Chinese
    "fugashi",
    "unidic-lite",
    "rjieba",
    # settings and secrets
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
subtitle = "subtitles_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
